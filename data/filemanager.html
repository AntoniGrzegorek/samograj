<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Manager</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }
        
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        
        .title {
            font-size: 2.5rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            background: linear-gradient(90deg, #00dbde, #fc00ff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 15px;
        }
        
        .main-container {
            display: flex;
            gap: 20px;
            flex: 1;
            min-height: 0;
        }
        
        .sidebar {
            flex: 0 0 250px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            overflow-y: auto;
        }
        
        .upload-btn {
            background: linear-gradient(135deg, #00dbde, #fc00ff);
            border: none;
            color: white;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .upload-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0, 219, 222, 0.4);
        }
        
        .upload-input {
            display: none;
        }
        
        .file-list-title {
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #00dbde;
            margin-top: 10px;
        }
        
        .file-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        .file-item {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 12px 15px;
            border-radius: 8px;
            cursor: pointer;
            position: relative;
            transition: all 0.2s ease;
            display: flex;
            justify-content: space-between;
            align-items: center;
            overflow: hidden;
        }
        
        .file-item:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.3);
            transform: translateX(5px);
        }
        
        .file-item.active {
            background: rgba(0, 219, 222, 0.2);
            border-color: #00dbde;
        }
        
        .file-name {
            font-size: 13px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
        }
        
        .file-icon {
            margin-right: 8px;
            font-size: 12px;
        }
        
        .actions-menu {
            position: absolute;
            right: 0;
            top: 0;
            height: 100%;
            background: rgba(0, 0, 0, 0.3);
            display: flex;
            gap: 2px;
            padding: 4px;
            opacity: 0;
            transition: opacity 0.2s ease;
        }
        
        .file-item:hover .actions-menu {
            opacity: 1;
        }
        
        .action-btn {
            background: rgba(0, 219, 222, 0.8);
            border: none;
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
            transition: all 0.2s ease;
            font-weight: 600;
        }
        
        .action-btn:hover {
            background: #00dbde;
            transform: scale(1.05);
        }
        
        .action-btn.delete {
            background: rgba(255, 71, 87, 0.8);
        }
        
        .action-btn.delete:hover {
            background: #ff4757;
        }
        
        .action-btn.convert {
            background: rgba(255, 159, 64, 0.8);
        }
        
        .action-btn.convert:hover {
            background: #ff9f40;
        }
        
        .action-btn.analyze {
            background: rgba(100, 200, 255, 0.8);
        }
        
        .action-btn.analyze:hover {
            background: #64c8ff;
        }
        
        .editor-section {
            flex: 1;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        .editor-header {
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #00dbde;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .editor-content {
            flex: 1;
            overflow-y: auto;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            padding: 15px;
        }
        
        .editor-textarea {
            width: 100%;
            height: 100%;
            background: transparent;
            border: none;
            color: #00dbde;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            resize: none;
            outline: none;
        }
        
        .editor-info {
            color: #a0a0a0;
            line-height: 1.6;
            font-family: 'Courier New', monospace;
            font-size: 12px;
        }
        
        .placeholder {
            color: #666;
            text-align: center;
            padding: 40px 20px;
        }
        
        .editor-actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .save-btn, .cancel-btn {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 12px;
            transition: all 0.2s ease;
            text-transform: uppercase;
        }
        
        .save-btn {
            background: linear-gradient(135deg, #00dbde, #fc00ff);
            color: white;
        }
        
        .save-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 219, 222, 0.4);
        }
        
        .cancel-btn {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        
        .cancel-btn:hover {
            background: rgba(255, 255, 255, 0.15);
        }
        
        .hidden {
            display: none;
        }
        
        @media (max-width: 1200px) {
            .main-container {
                flex-direction: column;
            }
            
            .sidebar {
                flex: 0 0 auto;
                max-height: 250px;
            }
        }.back-link {
            color: #00bfff;
            text-decoration: none;
            font-size: 14px;
        }
        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1 class="title">Zarządzanie Plikami</h1>
        <a href='/' class="back-link">← Powrót</a>
    </div>
    
    <div class="main-container">
        <div class="sidebar">
            <button class="upload-btn" onclick="document.getElementById('fileInput').click()">
                📁 Dodaj Plik
            </button>
            <input type="file" id="fileInput" class="upload-input" accept=".mid,.json" multiple>
            
            <div class="file-list-title">PLIKI</div>
            <ul class="file-list" id="fileList"></ul>
        </div>
        
        <div class="editor-section">
            <div class="editor-header" id="editorHeader">Edytor Plików</div>
            <div class="editor-content">
                <div class="placeholder" id="editorPlaceholder">
                    Wybierz plik z listy po lewej aby zobaczyć jego zawartość
                </div>
                <textarea class="editor-textarea hidden" id="jsonEditor"></textarea>
                <div class="editor-info hidden" id="midiInfo"></div>
            </div>
            <div class="editor-actions hidden" id="editorActions">
                <button class="save-btn" onclick="saveFile()">💾 Zapisz</button>
                <button class="cancel-btn" onclick="closeEditor()">✕ Zamknij</button>
            </div>
        </div>
    </div>
    
    <script>
        let currentFile = null;
        let currentMode = null; // 'json-edit', 'midi-analyze'
        let files = [];
        
        // Przechwycenie console.error i wysłanie do serwera
        const originalError = console.error;
        console.error = function(...args) {
            originalError.apply(console, args);
            const errorMessage = args.map(arg => 
                typeof arg === 'string' ? arg : JSON.stringify(arg)
            ).join(' ');
            
            fetch('/log', {
                method: 'POST',
                body: 'ERROR: ' + errorMessage
            }).catch(() => {});
        };
        
        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            loadFileList();
            setupUpload();
        });

        
        function setupUpload() {
            const fileInput = document.getElementById('fileInput');
            fileInput.addEventListener('change', async (e) => {
                const newFiles = e.target.files;
                for (let file of newFiles) {
                    await uploadFile(file);
                }
                fileInput.value = ''; // Reset input
                loadFileList();
            });
        }
        
        async function uploadFile(file) {
            try {
                const formData = new FormData();
                formData.append('file', file);
                
                const response = await fetch('/upload', {
                    method: 'POST',
                    body: formData
                });
                
                if (!response.ok) {
                    alert(`Błąd: ${response.statusText}`);
                }
            } catch (error) {
                console.error('Błąd uploadu:', error);
                alert('Błąd przy uploadzie pliku');
            }
        }
        
        async function loadFileList() {
            try {
                const response = await fetch('/files');
                files = await response.json();
                renderFileList();
            } catch (error) {
                console.error('Błąd ładowania listy:', error);
            }
        }
        
        function renderFileList() {
            const fileList = document.getElementById('fileList');
            fileList.innerHTML = '';
            
            files.forEach(file => {
                const li = document.createElement('li');
                li.className = 'file-item';
                
                const icon = file.name.endsWith('.json') ? '📄' : '🎵';
                const isJson = file.name.endsWith('.json');
                
                li.innerHTML = `
                    <span class="file-icon">${icon}</span>
                    <span class="file-name">${file.name}</span>
                    <div class="actions-menu">
                        ${isJson ? `
                            <button class="action-btn" onclick="editJsonFile('${file.name}')">✏️ Edytuj</button>
                        ` : `
                            <button class="action-btn analyze" onclick="analyzeMidiFile('${file.name}')">🔍 Zbadaj</button>
                            <button class="action-btn convert" onclick="convertToJson('${file.name}')">🔄 Konwertuj</button>
                        `}
                        <button class="action-btn delete" onclick="deleteFile('${file.name}')">🗑️ Usuń</button>
                    </div>
                `;
                
                fileList.appendChild(li);
            });
        }
        
        async function editJsonFile(filename) {
            try {
                const response = await fetch(`/file?filename=${filename}`);
                const content = await response.text();
                
                currentFile = filename;
                currentMode = 'json-edit';
                
                document.getElementById('editorPlaceholder').classList.add('hidden');
                document.getElementById('midiInfo').classList.add('hidden');
                document.getElementById('jsonEditor').classList.remove('hidden');
                document.getElementById('editorActions').classList.remove('hidden');
                
                document.getElementById('editorHeader').textContent = `📄 ${filename}`;
                document.getElementById('jsonEditor').value = content;
                
                highlightFile(filename);
            } catch (error) {
                console.error('Błąd ładowania JSON:', error);
                alert('Błąd przy ładowaniu pliku');
            }
        }
        
        async function analyzeMidiFile(filename) {
            try {
                const response = await fetch(`/analyze/${filename}`);
                const data = await response.json();
                
                currentFile = filename;
                currentMode = 'midi-analyze';
                
                document.getElementById('editorPlaceholder').classList.add('hidden');
                document.getElementById('jsonEditor').classList.add('hidden');
                document.getElementById('midiInfo').classList.remove('hidden');
                document.getElementById('editorActions').classList.add('hidden');
                
                document.getElementById('editorHeader').textContent = `🎵 ${filename}`;
                
                const infoDiv = document.getElementById('midiInfo');
                infoDiv.innerHTML = `
<pre>${JSON.stringify(data, null, 2)}</pre>
                `;
                
                highlightFile(filename);
            } catch (error) {
                console.error('Błąd analizy MIDI:', error);
                alert('Błąd przy analizie pliku MIDI');
            }
        }
        
        function convertToJson(filename) {
            alert('Funkcja konwertowania zostanie dodana wkrótce');
            // TODO: Zaimplementować endpoint /convert/{filename}
            console.log(`Konwertowanie ${filename} na JSON...`);
        }
        
        async function deleteFile(filename) {
            if (!confirm(`Czy naprawdę chcesz usunąć ${filename}?`)) {
                return;
            }
            
            try {
                const response = await fetch(`/delete?filename=${filename}`, {
                    method: 'DELETE'
                });
                
                if (response.ok) {
                    loadFileList();
                    closeEditor();
                } else {
                    alert('Błąd przy usuwaniu pliku');
                }
            } catch (error) {
                console.error('Błąd usuwania:', error);
                alert('Błąd przy usuwaniu pliku');
            }
        }
        
        async function saveFile() {
            if (currentMode !== 'json-edit') return;
            
            try {
                const content = document.getElementById('jsonEditor').value;
                
                const response = await fetch(`/save?filename=${currentFile}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'text/plain'
                    },
                    body: content
                });
                
                if (response.ok) {
                    alert('Plik zapisany pomyślnie!');
                    loadFileList();
                } else {
                    alert('Błąd przy zapisywaniu pliku');
                }
            } catch (error) {
                console.error('Błąd zapisu:', error);
                alert('Błąd przy zapisywaniu pliku');
            }
        }
        
        function closeEditor() {
            currentFile = null;
            currentMode = null;
            
            document.getElementById('editorPlaceholder').classList.remove('hidden');
            document.getElementById('jsonEditor').classList.add('hidden');
            document.getElementById('midiInfo').classList.add('hidden');
            document.getElementById('editorActions').classList.add('hidden');
            
            document.getElementById('editorHeader').textContent = 'Wybierz plik';
            
            files.forEach(f => {
                const item = document.querySelector(`[data-file="${f.name}"]`);
                if (item) item.classList.remove('active');
            });
        }
        
        function highlightFile(filename) {
            document.querySelectorAll('.file-item').forEach(item => {
                item.classList.remove('active');
            });
            
            const fileItems = document.querySelectorAll('.file-item');
            fileItems.forEach(item => {
                if (item.textContent.includes(filename)) {
                    item.classList.add('active');
                }
            });
        }
    </script>
</body>
